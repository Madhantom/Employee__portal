{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDM Admin Dashboard</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
<div class="sidebar">

    <div class="logo">
        <h2>MDM</h2>
        <p>Admin Panel</p>
    </div>
    <ul>

        <li class="{% if active_page == 'dashboard' %}active{% endif %}">
            <a href="{% url 'admin_dashboard' %}">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>

        <li class="{% if active_page == 'employees' %}active{% endif %}">
            <a href="{% url 'employee_list' %}">
                <i class="fa-solid fa-users"></i>
                Employees
            </a>
        </li>

        <li class="{% if active_page == 'add_employee' %}active{% endif %}">
            <a href="{% url 'add_employee' %}">
                <i class="fa-solid fa-user-plus"></i>
                Add Employee
            </a>
        </li>
        <li>
            <a href="{% url 'add_event' %}"><i class="fa-solid fa-plus"></i>Add Event</a>
        </li>

        <li class="{% if active_page == 'payslip' %}active{% endif %}">
            <a href="{% url 'add_payslip' %}">
                <i class="fa-solid fa-money-check-dollar"></i>
                Payslip
            </a>
        </li>

        <li class="{% if active_page == 'announcement' %}active{% endif %}">
            <a href="{% url 'add_announcement' %}">
                <i class="fa-solid fa-bullhorn"></i>
                Announcement
            </a>
        </li>

        <li class="{% if active_page == 'announcement' %}active{% endif %}">
            <a href="{% url 'admin_helpdesk' %}">
                
                📞Help Desk
            </a>
        </li>

        <li class="{% if active_page == 'messages' %}active{% endif %}">
            <a href="{% url 'send_message' %}">
                <i class="fa-solid fa-paper-plane"></i>
                Messages
            </a>
        </li>

        <li class="{% if active_page == 'inbox' %}active{% endif %}">
            <a href="{% url 'admin_messages' %}">
                <i class="fa-solid fa-envelope"></i>
                Inbox
            </a>
        </li>

        <li class="{% if active_page == 'holiday' %}active{% endif %}">
            <a href="{% url 'add_holiday' %}">
                <i class="fa-solid fa-calendar-days"></i>
                Holiday
            </a>
        </li>

        <li>
            <a href="{% url 'logout' %}">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </li>

    </ul>

</div>
</body>
</html>
