{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Event</title>
</head>
<body>
{% include "admin_slidebar.html" %}
<div class="main">
    <a href="{% url 'admin_dashboard' %}" class="back-btn">⬅️back to Dashboard</a><br><br>
<h2>Add Event</h2>

<form method="POST">
    {% csrf_token %}

    <label>Title</label><br>
    <input type="text" name="title" required class="form-control"><br><br>
<div class="form-group">
    <label>Date</label><br>
    <input type="date" name="date" required><br><br>
</div>
<div class="form-group">
    <label>Description</label><br>
    <textarea name="message" rows="8" placeholder="write the event" required></textarea><br><br>
</div>
    <button type="submit" class="submit-btn">Add Event</button>
</form>
</div>
</body>
</html>
